# Secrets: a gitleaks scan for committed credentials and keys. Each repo's
# checks.yml calls it with the job id `secrets`, so its status check is
# `secrets / Secrets`:
#
#   on:
#     pull_request: ...
#     merge_group:
#     push:
#       branches: [main]
#   jobs:
#     secrets:
#       permissions:
#         contents: read
#       uses: Steward-GRC/.github/.github/workflows/secrets.yml@main
#
# What it scans:
#   - pull_request: only the PR's own commits (base..head), so a bad commit on
#     some other branch never blocks every PR;
#   - merge_group: only the group's commits (base..head);
#   - push, schedule or any other event: the full history of the checked-out
#     ref.
#
# Rules: gitleaks' built-in secret rules only. It always runs with a config
# that just extends the defaults, so no repo file can add other rules. A false
# positive is allowed with a `gitleaks:allow` comment on the line, or its
# fingerprint in the repo's .gitleaksignore. Findings are redacted in the log.
#
# Assets: every tracked image, icon, PDF and SVG at the checked-out commit is
# also checked for embedded provenance metadata (C2PA manifests in JUMBF boxes,
# PNG caBX chunks), which some export tools add. Any hit fails the job with the
# file named; re-export or strip the file. Self-test:
# .github/scripts/asset-provenance_test.sh.
#
# gitleaks is downloaded at a pinned version and checked against the SHA-256
# listed in that release's checksums file. It takes no secrets.
name: secrets

on:
  workflow_call:

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  secrets:
    name: Secrets
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          tgz="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $tgz" | sha256sum -c -
          tar -xzf "$tgz" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan for secrets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/gitleaks-defaults.toml"
          printf '[extend]\nuseDefault = true\n' > "$config"
          args=(git --config "$config" --redact --no-banner --exit-code 1)
          case "$EVENT" in
            pull_request | merge_group)
              if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
                echo "::error::No commit range for a ${EVENT} event."
                exit 2
              fi
              echo "Scanning ${BASE}..${HEAD}."
              args+=(--log-opts "${BASE}..${HEAD}")
              ;;
            *)
              echo "Scanning the full history."
              ;;
          esac
          gitleaks "${args[@]}" .

      - name: Scan assets for provenance metadata
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            if LC_ALL=C grep -qaE 'c2pa|C2PA|caBX|jumb|contentauth' -- "$f"; then
              echo "::error file=${f}::${f} carries provenance metadata (C2PA/JUMBF). Re-export or strip it before committing."
              found=$((found + 1))
            fi
          done < <(git ls-files -z -- \
            ':(icase)*.png' ':(icase)*.jpg' ':(icase)*.jpeg' ':(icase)*.gif' \
            ':(icase)*.webp' ':(icase)*.avif' ':(icase)*.heic' ':(icase)*.tif' \
            ':(icase)*.tiff' ':(icase)*.ico' ':(icase)*.svg' ':(icase)*.pdf')
          if [ "$found" -gt 0 ]; then
            echo "${found} asset(s) carry provenance metadata."
            exit 1
          fi
          echo "No provenance metadata in tracked assets."
